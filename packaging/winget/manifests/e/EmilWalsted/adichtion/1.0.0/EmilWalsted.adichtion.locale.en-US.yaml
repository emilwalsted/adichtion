ShortDescription: View and export LabChart .adicht recordings without LabChart.
Description: |-
  adichtion opens LabChart .adicht files: every channel on one time axis with the blocks
  laid end to end, comments, the video recorded with a block, and the definitions of
  calculated channels recovered from the data. It exports the file, a block or a selection
  as LabChart-style text, CSV or Excel.
