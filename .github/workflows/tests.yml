name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # The matrix label stays "ubuntu-latest" so the check names do not change, but the runner
    # is pinned: the Linux leg installs Qt system libraries with apt, and package names can
    # differ on a newer default image.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen      # the viewer tests run headless
      PYQTGRAPH_QT_LIB: PySide6
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -e ".[ui,dev]"
      - run: python -m pytest -q
      - run: python -m adichtion --version
      - name: The viewer imports and builds its window headless
        run: python -c "from PySide6.QtWidgets import QApplication; from adichtion.ui import theme; from adichtion.ui.main_window import MainWindow; app = QApplication([]); theme.apply_theme(app); w = MainWindow(); assert w.stack is not None; w.close(); print('GUI OK')"
